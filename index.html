<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 감옥 탈출 (PRISON BREAK)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-card {
            background: #1e293b;
            width: 92%;
            max-width: 480px;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            text-align: center;
            position: relative;
        }

        h1 {
            margin: 0 0 5px 0;
            color: #f59e0b;
            font-size: 1.6rem;
            letter-spacing: -0.5px;
        }

        .stage-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 15px 0 20px 0;
        }

        .badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 12px;
            background: #334155;
            color: #94a3b8;
            font-weight: bold;
        }

        .badge.active {
            background: #f59e0b;
            color: #0f172a;
        }

        /* 게임 스테이지 공통 */
        .stage-box {
            background: #0f172a;
            border-radius: 15px;
            padding: 20px;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #334155;
            position: relative;
        }

        /* 1단계: 자물쇠 따기 */
        .lock-container {
            width: 100%;
            height: 30px;
            background: #1e293b;
            border-radius: 15px;
            position: relative;
            margin: 40px 0 20px 0;
            overflow: hidden;
            border: 1px solid #475569;
        }

        .target-zone {
            position: absolute;
            height: 100%;
            background: rgba(34, 197, 94, 0.4);
            border-left: 2px solid #22c55e;
            border-right: 2px solid #22c55e;
        }

        .pin {
            position: absolute;
            width: 8px;
            height: 100%;
            background: #ef4444;
            box-shadow: 0 0 10px #ef4444;
            top: 0;
        }

        /* 2단계: 순찰 피하기 */
        .guard-status {
            font-size: 3.5rem;
            margin-top: 10px;
        }

        .track-bg {
            width: 100%;
            height: 12px;
            background: #334155;
            border-radius: 6px;
            overflow: hidden;
            margin-top: auto;
        }

        .track-fill {
            height: 100%;
            width: 0%;
            background: #3b82f6;
            transition: width 0.1s linear;
        }

        .track-player {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 1.8rem;
            margin-top: 5px;
            position: relative;
        }

        .runner {
            position: absolute;
            left: 0%;
            transition: left 0.1s linear;
        }

        /* 3단계: 담장 넘기 */
        .wall-container {
            width: 40px;
            height: 140px;
            background: #334155;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            border: 2px solid #475569;
        }

        .wall-fill {
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, #3b82f6, #60a5fa);
            transition: height 0.05s ease-out;
        }

        .timer-display {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ef4444;
        }

        /* 컨트롤 버튼 */
        .action-btn {
            width: 100%;
            margin-top: 20px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #f59e0b;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
            transition: background 0.1s, transform 0.05s;
        }

        .action-btn:active {
            transform: scale(0.97);
            background-color: #d97706;
        }

        /* 결과 모달 */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .overlay h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .overlay p {
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .restart-btn {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .hidden { display: none !important; }
        .text-sub { color: #94a3b8; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>🚨 감옥 탈출 (PRISON BREAK)</h1>
        
        <!-- 단계 표시기 -->
        <div class="stage-indicator">
            <span id="badge1" class="badge active">1. 자물쇠 따기</span>
            <span id="badge2" class="badge">2. 순찰 피하기</span>
            <span id="badge3" class="badge">3. 담장 넘기</span>
        </div>

        <!-- 1단계 화면 -->
        <div id="stage1" class="stage-box">
            <div>
                <h3>🔓 자물쇠 핀을 맞추세요!</h3>
                <p class="text-sub">핀이 초록색 영역에 올 때 버튼을 누르세요.</p>
            </div>
            <div class="lock-container">
                <div id="targetZone" class="target-zone"></div>
                <div id="pin" class="pin"></div>
            </div>
            <div id="lockCounter" style="font-size: 1.2rem;">성공: 0 / 3</div>
        </div>

        <!-- 2단계 화면 -->
        <div id="stage2" class="stage-box hidden">
            <div>
                <h3>🔦 교도관의 눈을 피하세요!</h3>
                <p id="st2Desc" class="text-sub">교도관이 딴짓할 때만 이동하세요.</p>
            </div>
            <div id="guardEmoji" class="guard-status">😴</div>
            <div style="width: 100%;">
                <div class="track-bg"><div id="st2Progress" class="track-fill"></div></div>
                <div class="track-player">
                    <span id="st2Runner" class="runner">🏃‍♂️</span>
                    <span style="margin-left: auto;">🚪</span>
                </div>
            </div>
        </div>

        <!-- 3단계 화면 -->
        <div id="stage3" class="stage-box hidden">
            <div>
                <h3>🧱 탐조등을 피해 담장을 넘으세요!</h3>
                <p class="text-sub">제한시간 안에 버튼을 **미친듯이 연타**하세요!</p>
            </div>
            <div class="timer-display" id="st3Timer">⏱️ 10.0초</div>
            <div class="wall-container">
                <div id="st3Wall" class="wall-fill"></div>
            </div>
            <div id="st3Percent">0%</div>
        </div>

        <!-- 조작 버튼 -->
        <button id="mainBtn" class="action-btn">액션 버튼 (스페이스바 가능)</button>

        <!-- 결과 모달 -->
        <div id="resultModal" class="overlay hidden">
            <h2 id="resTitle">🚨 탈출 실패!</h2>
            <p id="resDesc">교도관에게 발각되었습니다.</p>
            <button class="restart-btn" onclick="initGame()">처음부터 다시 시도</button>
        </div>
    </div>

    <script>
        // 현재 게임 상태
        let currentStage = 1;
        let isGameOver = false;

        // UI 요소
        const badge1 = document.getElementById('badge1');
        const badge2 = document.getElementById('badge2');
        const badge3 = document.getElementById('badge3');
        const stage1 = document.getElementById('stage1');
        const stage2 = document.getElementById('stage2');
        const stage3 = document.getElementById('stage3');
        const mainBtn = document.getElementById('mainBtn');
        const resultModal = document.getElementById('resultModal');
        const resTitle = document.getElementById('resTitle');
        const resDesc = document.getElementById('resDesc');

        // --- 1단계 변수 ---
        let pinPos = 0;
        let pinSpeed = 1.8;
        let pinDir = 1;
        let targetMin = 40;
        let targetMax = 65;
        let lockSuccessCount = 0;
        let stage1AnimFrame = null;

        // --- 2단계 변수 ---
        let st2Pos = 0;
        let st2GuardState = 'SAFE'; // SAFE, WARNING, DANGER
        let st2MoveInterval = null;
        let st2GuardTimer = null;
        let isSt2Moving = false;

        // --- 3단계 변수 ---
        let st3Climb = 0;
        let st3TimeLeft = 10.0;
        let st3TimerInterval = null;

        // 전체 게임 초기화
        function initGame() {
            currentStage = 1;
            isGameOver = false;
            resultModal.classList.add('hidden');

            badge1.className = 'badge active';
            badge2.className = 'badge';
            badge3.className = 'badge';

            stage1.classList.remove('hidden');
            stage2.classList.add('hidden');
            stage3.classList.add('hidden');

            initStage1();
        }

        // ==========================================
        // 🔓 1단계: 자물쇠 따기 로직
        // ==========================================
        function initStage1() {
            lockSuccessCount = 0;
            document.getElementById('lockCounter').innerText = `성공: ${lockSuccessCount} / 3`;
            mainBtn.innerText = '핀 맞추기! (클릭/스페이스바)';
            randomizeTarget();
            animatePin();
        }

        function randomizeTarget() {
            targetMin = Math.floor(Math.random() * 50) + 20; // 20 ~ 70
            targetMax = targetMin + 20; // 폭 20%
            const targetZone = document.getElementById('targetZone');
            targetZone.style.left = targetMin + '%';
            targetZone.style.width = (targetMax - targetMin) + '%';
        }

        function animatePin() {
            if (currentStage !== 1 || isGameOver) return;
            pinPos += pinSpeed * pinDir;
            if (pinPos >= 96) pinDir = -1;
            if (pinPos <= 0) pinDir = 1;

            document.getElementById('pin').style.left = pinPos + '%';
            stage1AnimFrame = requestAnimationFrame(animatePin);
        }

        function handleStage1Action() {
            if (pinPos >= targetMin && pinPos <= targetMax) {
                lockSuccessCount++;
                document.getElementById('lockCounter').innerText = `성공: ${lockSuccessCount} / 3`;
                if (lockSuccessCount >= 3) {
                    cancelAnimationFrame(stage1AnimFrame);
                    startStage2();
                } else {
                    randomizeTarget();
                }
            } else {
                gameOver("🚨 감옥 자물쇠 해제 실패!", "자물쇠를 억지로 따려다 경보음이 울렸습니다.");
            }
        }

        // ==========================================
        // 🔦 2단계: 순찰 피하기 로직
        // ==========================================
        function startStage2() {
            currentStage = 2;
            badge1.className = 'badge';
            badge2.className = 'badge active';
            stage1.classList.add('hidden');
            stage2.classList.remove('hidden');

            st2Pos = 0;
            st2GuardState = 'SAFE';
            isSt2Moving = false;
            document.getElementById('st2Progress').style.width = '0%';
            document.getElementById('st2Runner').style.left = '0%';
            mainBtn.innerText = '꾹 눌러서 살금살금 이동!';

            updateGuardUI();
            scheduleGuardState();
        }

        function scheduleGuardState() {
            if (currentStage !== 2 || isGameOver) return;

            let time = 0;
            if (st2GuardState === 'SAFE') {
                time = Math.random() * 2000 + 1500;
                st2GuardTimer = setTimeout(() => { setGuardState('WARNING'); }, time);
            } else if (st2GuardState === 'WARNING') {
                time = 700;
                st2GuardTimer = setTimeout(() => { setGuardState('DANGER'); }, time);
            } else if (st2GuardState === 'DANGER') {
                time = Math.random() * 1500 + 1200;
                st2GuardTimer = setTimeout(() => { setGuardState('SAFE'); }, time);
            }
        }

        function setGuardState(state) {
            if (currentStage !== 2 || isGameOver) return;
            st2GuardState = state;
            updateGuardUI();

            if (st2GuardState === 'DANGER' && isSt2Moving) {
                gameOver("🚨 교도관에게 들켰습니다!", "손전등 불빛에 포착되어 독방에 갇혔습니다.");
                return;
            }
            scheduleGuardState();
        }

        function updateGuardUI() {
            const emoji = document.getElementById('guardEmoji');
            const desc = document.getElementById('st2Desc');
            if (st2GuardState === 'SAFE') {
                emoji.innerText = '😴';
                desc.innerText = '교도관이 조는 중... (이동 가능)';
                desc.style.color = '#22c55e';
            } else if (st2GuardState === 'WARNING') {
                emoji.innerText = '❓';
                desc.innerText = '교도관: "음? 무슨 소리지?" (멈출 준비!)';
                desc.style.color = '#f59e0b';
            } else if (st2GuardState === 'DANGER') {
                emoji.innerText = '🔦';
                desc.innerText = '교도관: 손전등 수색 중! (움직이지 마세요!)';
                desc.style.color = '#ef4444';
            }
        }

        function startSt2Move() {
            if (currentStage !== 2 || isGameOver || isSt2Moving) return;
            isSt2Moving = true;

            st2MoveInterval = setInterval(() => {
                if (!isSt2Moving || isGameOver) return;
                if (st2GuardState === 'DANGER') {
                    gameOver("🚨 교도관에게 들켰습니다!", "손전등 불빛에 포착되어 독방에 갇혔습니다.");
                    return;
                }

                st2Pos += 1.2;
                if (st2Pos > 88) st2Pos = 88;

                document.getElementById('st2Progress').style.width = (st2Pos / 88 * 100) + '%';
                document.getElementById('st2Runner').style.left = st2Pos + '%';

                if (st2Pos >= 88) {
                    stopSt2Move();
                    clearTimeout(st2GuardTimer);
                    startStage3();
                }
            }, 30);
        }

        function stopSt2Move() {
            isSt2Moving = false;
            clearInterval(st2MoveInterval);
        }

        // ==========================================
        // 🧱 3단계: 담장 넘기 로직
        // ==========================================
        function startStage3() {
            currentStage = 3;
            badge2.className = 'badge';
            badge3.className = 'badge active';
            stage2.classList.add('hidden');
            stage3.classList.remove('hidden');

            st3Climb = 0;
            st3TimeLeft = 10.0;
            mainBtn.innerText = '⚡ 연타하여 담장 넘기! (광클!)';

            document.getElementById('st3Wall').style.height = '0%';
            document.getElementById('st3Percent').innerText = '0%';
            document.getElementById('st3Timer').innerText = `⏱️ ${st3TimeLeft.toFixed(1)}초`;

            st3TimerInterval = setInterval(() => {
                st3TimeLeft -= 0.1;
                if (st3TimeLeft <= 0) {
                    st3TimeLeft = 0;
                    document.getElementById('st3Timer').innerText = `⏱️ 0.0초`;
                    clearInterval(st3TimerInterval);
                    gameOver("🚨 탐조등에 적발되었습니다!", "제한시간 내에 담장을 넘지 못했습니다.");
                } else {
                    document.getElementById('st3Timer').innerText = `⏱️ ${st3TimeLeft.toFixed(1)}초`;
                }
            }, 100);
        }

        function handleStage3Action() {
            if (currentStage !== 3 || isGameOver) return;

            st3Climb += 4.5;
            if (st3Climb > 100) st3Climb = 100;

            document.getElementById('st3Wall').style.height = st3Climb + '%';
            document.getElementById('st3Percent').innerText = Math.floor(st3Climb) + '%';

            if (st3Climb >= 100) {
                clearInterval(st3TimerInterval);
                gameWin();
            }
        }

        // ==========================================
        // 게임 결과 처리
        // ==========================================
        function gameOver(title, desc) {
            isGameOver = true;
            cancelAnimationFrame(stage1AnimFrame);
            clearTimeout(st2GuardTimer);
            clearInterval(st2MoveInterval);
            clearInterval(st3TimerInterval);

            resTitle.innerText = title;
            resTitle.style.color = '#ef4444';
            resDesc.innerText = desc;
            resultModal.classList.remove('hidden');
        }

        function gameWin() {
            isGameOver = true;
            resTitle.innerText = '🎉 감옥 탈출 성공!';
            resTitle.style.color = '#10b981';
            resDesc.innerText = '축하합니다! 무사히 담장을 넘어 자유의 몸이 되었습니다! 🚁💨';
            resultModal.classList.remove('hidden');
        }

        // ==========================================
        // 이벤트 리스너
        // ==========================================
        mainBtn.addEventListener('mousedown', () => {
            if (currentStage === 1) handleStage1Action();
            else if (currentStage === 2) startSt2Move();
            else if (currentStage === 3) handleStage3Action();
        });

        mainBtn.addEventListener('mouseup', () => {
            if (currentStage === 2) stopSt2Move();
        });

        mainBtn.addEventListener('mouseleave', () => {
            if (currentStage === 2) stopSt2Move();
        });

        // 터치 지원 (모바일)
        mainBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (currentStage === 1) handleStage1Action();
            else if (currentStage === 2) startSt2Move();
            else if (currentStage === 3) handleStage3Action();
        });

        mainBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (currentStage === 2) stopSt2Move();
        });

        // 키보드 지원 (스페이스바)
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat) {
                if (currentStage === 1) handleStage1Action();
                else if (currentStage === 2) startSt2Move();
                else if (currentStage === 3) handleStage3Action();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                if (currentStage === 2) stopSt2Move();
            }
        });

        // 게임 시작
        initGame();
    </script>
</body>
</html>
